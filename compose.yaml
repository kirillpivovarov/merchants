services:
  meridian:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN to a long random value}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - meridian-data:/app/data
    restart: unless-stopped
volumes:
  meridian-data:
