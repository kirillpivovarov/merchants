services:
  tkb-demo:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN to a long random value}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:3000}
    volumes:
      - tkb-demo-data:/app/data
    restart: unless-stopped
volumes:
  tkb-demo-data:
    name: ${TKB_DATA_VOLUME:-tkb-demo-data}
